name: zmj acceptance

on:
  push:
    branches: [zmj]
  pull_request:
    branches: [main, zmj]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    # PR branches above refer to the target. Include Zhu's outgoing PR to main
    # and PRs into zmj, without running this job for unrelated feature branches.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/zmj') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/zmj') ||
      (github.event_name == 'pull_request' &&
       (github.head_ref == 'zmj' || github.base_ref == 'zmj'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out tested revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run every acceptance check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' }}
        run: python scripts/run_acceptance.py
      - name: Upload logs and structured results, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/acceptance/
          if-no-files-found: warn
          retention-days: 14
