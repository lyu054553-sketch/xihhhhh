<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base" content="/api/v1">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

  </head>
  <body>

    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar" aria-label="业务导航" tabindex="-1">
        <div class="brand"><span class="brand-mark material-symbols-rounded" aria-hidden="true">inventory_2</span><span><strong>货不压钱</strong><small>库存决策工作台</small></span><button class="icon-button nav-close" type="button" data-close-navigation aria-label="关闭导航"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></div>
        <nav id="app-nav" class="app-nav" aria-label="主导航">
          <a href="#overview"><span class="material-symbols-rounded" aria-hidden="true">monitoring</span>经营总览</a>
          <a href="#today"><span class="material-symbols-rounded" aria-hidden="true">task_alt</span>今日待办</a>
          <p class="nav-label nav-label-secondary">分析与测算</p>
          <a href="#slow_moving"><span class="material-symbols-rounded" aria-hidden="true">troubleshoot</span>滞销诊断</a>

          <a href="#procurement-brake"><span class="material-symbols-rounded" aria-hidden="true">front_hand</span>采购刹车</a>

        </nav>
        <div class="sidebar-note"><span class="badge">规则计算 · 人工确认</span><p>当前模型适配层尚未接入。<br>测算、审批和执行回执分别记录。</p></div>
      </aside>
      <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="关闭导航" tabindex="-1" hidden></button>

          <div id="connection-status" class="status-panel" role="status"></div>
          <div id="page-status" aria-live="polite" aria-atomic="true"></div>
          <section id="page-content" aria-labelledby="page-title"></section>
          <footer class="workspace-footer">金额按人民币元展示；库存占用、少采购和现金到账分别核对。当前仅记录本地任务与人工回执。</footer>
        </main>
      </div>
